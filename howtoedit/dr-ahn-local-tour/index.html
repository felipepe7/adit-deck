<script>window.DATA={"pageTitle": "Dr. Ahn Tour Breakdown", "headline": "The premium tour.", "headline2": "Shot by shot.", "lead": "This is the standard for every tour we edit from here on. Dr. Katherine Ahn walks us through a suite that is still under construction, and every raw room is answered by a rendering of the finished room on the exact word she names it.", "forWhat": "Every Puro Flow editor (Yash, Adrian and the team)", "stats": [["31", "shots in 2:33"], ["4.9s", "average shot length"], ["8", "AI renderings of finished rooms"], ["~11 dB", "music sits under the voice"]], "rulesTitle": "Four rules for every tour", "rulesLead": "When we follow someone through a space, the camera has to feel expensive. That means stable, angled and moving for a reason.", "rules": [{"t": "Stable, always", "d": "Gimbal or locked off. If a clip shakes, stabilize it or cut it. <b>No shaky handheld in a tour.</b>"}, {"t": "Never flat", "d": "Never park the camera square on the subject against a flat wall. Swing to a <b>3/4 angle</b>, put something in the foreground (ladder, doorframe, scaffolding) and place them off-center.", "warn": true}, {"t": "No slow zoom in or out", "d": "No scale keyframes, no Ken Burns push in the edit. <b>Movement comes from the camera</b> (follow, arc, slide, reveal) or from the render, never from a digital zoom.", "warn": true}, {"t": "New room, new angle", "d": "Every time she names a space, cut. Back-to-back shots never share a framing, and every raw room gets its render."}], "structTitle": "Place, then before and after, then the why", "structLead": "Six beats. The tour earns the message.", "beats": [{"n": "Establish", "a": 0, "b": 2.75, "d": "Two drone shots, no voice yet."}, {"n": "Arrive", "a": 2.75, "b": 12.76, "d": "Wide in the raw suite, punch in, back wide."}, {"n": "Raw to render", "a": 12.76, "b": 45.5, "d": "Reception, video wall, storefront."}, {"n": "The why", "a": 45.5, "b": 75.5, "d": "Consultation room, black and white cutaway, root causes."}, {"n": "Clinical suite", "a": 75.5, "b": 127.6, "d": "Low-key amber. Lab, treatment #2 and #3."}, {"n": "Close", "a": 127.6, "b": 153.1, "d": "22 second talking head, logo card."}], "pace": {"title": "Five seconds a shot, one long close", "lead": "Tours breathe more than reels, but no shot sits still for long until the very end.", "notes": ["Renders hold 1.4 to 8.3 seconds: long enough for their slide to finish.", "The 22 second close is earned by two minutes of movement before it."]}, "moves": [[0.0, "Drone", "Beverly Hills boulevard at golden hour."], [1.21, "Drone", "The building courtyard."], [10.55, "Light leak", "Warm leak out of \"little tour\"."], [14.26, "Light leak", "Leak out of the reception render."], [26.69, "Flash", "Light flash out of the storefront."], [45.5, "Whip", "Whip blur into the consultation room."], [59.14, "Cutaway", "Black and white stock for \"most clinics\"."], [75.5, "Foreground wipe", "Doorframe passes the lens into the clinical suite."], [87.84, "Flare", "Practical light sweeps across the dark room."], [105.2, "Foreground wipe", "Doorframe wipe into treatment #2."], [149.48, "Dissolve", "Into the curtain logo card."]], "typeTitle": "Captions, titles, marks", "typeLead": "", "typeNotes": ["Two to three words at a time, white, thin sans serif, lower third.", "<b>Bold one key word</b> per line: breathe, live, smile, sterilization, foundation.", "Big titles name the place: \"little tour\", \"video wall\", \"treatment #2\".", "Hand-drawn circle on \"root causes\" (1:07), scribble under \"improve\" (1:12)."], "capsSamples": ["<b>breathe</b> better,", "<b>live</b> better,", "and <b>smile</b>", "the <b>foundation</b>"], "checklist": ["<b>Stable:</b> no shaky handheld in any tour shot", "<b>No flat frames:</b> 3/4 angle, off-center, foreground layer", "<b>No digital zoom:</b> push in by cutting", "<b>New room, new angle</b> every time", "<b>Every raw room has its render</b>, cut in on the word", "<b>Renders checked</b> for warped lines and fake text", "<b>Grade:</b> warm cream whites, low-key rooms go dark", "<b>Captions:</b> 2 to 3 words, one bold key word", "<b>Music about 10 dB under the voice</b>", "<b>End on the logo card</b>, about 3 seconds"], "num": 6, "of": 13, "slug": "dr-ahn-local-tour", "label": "Aviara #3: Dr. Ahn, Local Tour", "kind": "Tour", "drive": "https://drive.google.com/file/d/18y9am6hG2f4KqIZCi_Q2-_fTRwJ7mUX8/view", "vert": true, "dur": 153.13, "W": 2160, "H": 3840, "fps": "23.976", "shots": [["drone", 0.0, 1.2, "Drone: Beverly Hills, golden hour", "", "High drone over a palm-lined boulevard with the sun on the horizon. Slow forward drift, perfectly smooth.", "Cold open. No title and no voice for the first 2.7 seconds, just music.", "Location sells the brand before she says a word."], ["drone", 1.2, 2.8, "Drone: the building", "", "Drone holds on the courtyard of the building, warm late light on the brick and arches.", "Hard cut from the wide city to this one building.", "City, then address. Two shots and we know exactly where we are."], ["talent", 2.8, 8.5, "Wide: inside the raw suite", "So we are now inside the Aviara aesthetic suite", "Wide from a low position, ladder in the left foreground, Dr. Ahn small in frame among the raw walls. Stable.", "First caption appears with her first word.", "We show the space honestly as a construction site. The ladder adds depth so it never looks flat."], ["talent", 8.5, 10.6, "Punch in at 3/4: little tour", "I'm going to give you a little tour", "Medium shot from a new angle, roughly 45° off her, so she is never square to the lens.", "Big bold \"little tour\" title with a sparkle, then a warm light leak carries us out.", "Same moment, new angle. The cut resets attention without leaving the room."], ["talent", 10.6, 12.8, "Back wide: the entrance", "So this is the entrance.", "Back to the wide, arms open to present the room.", "Cut on her gesture, so the move does the work.", "Her open arms make the reveal feel welcoming."], ["ai", 12.8, 14.2, "Render: reception", "And our reception desk", "Finished entrance with glass doors, chandelier and desk chair. Slow lateral slide.", "Cut in on \"And our\", out with a light leak.", "First render. Sets the pattern: raw room, then the finished room."], ["ai", 14.2, 16.9, "Render: the Aviara desk", "will be right there", "Reception desk with the Aviara logo, cove light, an olive tree. Slow slide that reveals the plant.", "Held long enough to read the logo.", "The brand shows up on the wall of the room she is describing."], ["talent", 16.9, 19.4, "Follow: to the video wall", "And to the right of me is our video wall", "She walks right toward a taped raw wall. The camera pans with her on the gimbal.", "\"video wall\" big bold title, which ghosts out as we cut.", "Movement leads the eye to the empty wall we are about to fill."], ["ai", 19.4, 23.3, "Render: the video wall", "This video wall will be used to educate our patients", "The finished wall of screens playing fashion imagery, framed by plants.", "\"educate\" sits bold above \"our patients\".", "The empty wall from the shot before is now real."], ["talent", 23.3, 26.7, "Negative space: the raw wall", "on all the important ... that we have to offer.", "She sits low in the bottom right of frame, the raw wall and hanging conduit fill the top.", "Captions sit beside her, not over her face.", "Off-center framing is the opposite of flat. The space is the subject."], ["talent", 26.8, 31.5, "Follow from behind: the storefront", "So this storefront right here area will focus on", "Camera follows behind her shoulder into the storefront, she turns and points. Yellow scaffolding frames the shot.", "Light flash out of the shot.", "Following from behind puts the viewer in the room with her."], ["ai", 31.7, 38.8, "Render: the arched shelves", "products that will help our patients breathe better, live better, and smile better", "Arched retail niches with warm under-shelf light. Slow lateral slide.", "Key words go bold on each beat: breathe, live, smile.", "The longest render, because it carries the promise of the brand."], ["talent", 38.8, 45.5, "Medium: three arches", "so that's why we have three arches representing the three pillars of the foundation of health.", "Medium wide, she gestures to the three raw arch openings behind her.", "Whip blur out to the next room.", "The raw arches pay off the render we just saw. The design has meaning."], ["talent", 45.6, 56.7, "High-key MCU: consultation room", "and consultation room. And to me this is the most important room", "Bright, creamy room. Medium close-up at 3/4, she turns to show the room and back to us. Smooth gimbal.", "\"important room\" in bold.", "The brightest room is the most important room. The light says it too."], ["broll", 56.7, 59.1, "Insert: across the raw room", "most wellness clinics.", "Pan across a raw wall with fixtures to the scaffolding.", "B-roll over her voice.", "Gives the eye a rest before the contrast beat."], ["stock", 59.1, 61.9, "Black and white cutaway", "focus on treatment, but...", "A clinic consult in full black and white.", "Huge bold \"treatment\", then \"but...\".", "Black and white means the old way. She never has to name anyone."], ["talent", 61.9, 75.5, "Back in color: root causes", "what we really need is to understand the patient's problems, their root causes", "Same consultation room setup, she turns into the lens as she makes the point.", "Hand-drawn circle around \"root causes\", scribble under \"improve\".", "Color returns with her answer. The marks make the big idea stick."], ["talent", 75.5, 81.5, "Doorframe reveal: clinical suite", "now we're inside our clinical suite, and right side, we have our", "A dark doorframe passes the lens and reveals her face in low light. She turns and leads us deeper.", "The grade drops to low-key amber on this cut.", "Foreground wipe plus a mood change says we entered a new kind of room."], ["ai", 81.5, 84.3, "Render: esthetic and longevity suite", "esthetic and longevity suite.", "Treatment chair against onyx shelving. Slow slide left.", "\"esthetic\" and \"longevity suite.\" in bold.", "The render stays bright, which lifts the dark section."], ["ai", 84.3, 87.9, "Render: the cabinetry", "So here we will focus on all the natural regenerative approaches to", "Second render of the same suite, sliding across the cabinetry.", "Two renders back to back for one room.", "A second angle makes the room feel real, not like a single still."], ["broll", 87.9, 90.3, "Flare pass", "health and beauty.", "Dark room with green tile, a practical light flares across the lens.", "Used as the transition into the lab.", "An in-camera transition, no plugin needed."], ["talent", 90.3, 94.7, "Side light: the lab", "This is our sterilization and laboratory.", "Medium in a dark doorway, one soft window light from the side. She gestures into the room.", "\"sterilization\" and \"laboratory.\" in bold.", "One motivated light source. That is what makes low-key look expensive."], ["talent", 94.7, 100.6, "Same setup, tighter", "to be able to design smiles, print models,", "Slightly tighter on the same setup.", "A cut in instead of a zoom.", "We get closer by cutting, never by scaling the clip."], ["talent", 100.6, 105.2, "The Smile Design Laboratory", "custom smile design. All of that work will be done in the Smile Design Laboratory.", "Holds on the same angle as she names the lab.", "\"Smile Design Laboratory.\" in bold. Short whip out.", "Naming the room is the payoff of the lab section."], ["talent", 105.2, 108.5, "Doorframe wipe: treatment #2", "Yes. This is treatment #2", "She steps toward a doorway, the dark frame wipes the lens.", "\"treatment #2\" title fades up big, then ghosts.", "Titles work like chapter markers so viewers never get lost."], ["ai", 108.5, 113.5, "Render: treatment room #2", "And in this room, we will be able to help our patients with a", "High angle on a white treatment bed in a bright room. Slow slide.", "Cut in on \"room\".", "Raw room, then render. The pattern holds all the way through."], ["talent", 113.5, 117.7, "Low-key MCU", "lot of the facial and oral health rejuvenation.", "Medium close-up, a doorframe edge in the foreground, warm side light.", "Captions only, no title.", "Foreground edge keeps even a simple talking shot layered."], ["talent", 117.7, 119.3, "Title beat: treatment #3", "This is treatment #3", "Same low-key look, quick beat.", "\"treatment #3\" title.", "A short beat that sets up the last reveal."], ["ai", 119.3, 127.6, "Render: Smile Design studio", "It's where all of the smile design work will be done in this room. So this is my Smile Design studio.", "Dental chair against an onyx wall. Long lateral slide that reveals an olive tree.", "Held for 8 seconds, the longest look at any room.", "The last room is her signature room, so it gets the most time."], ["talent", 127.6, 149.5, "The close: her philosophy", "Naturally, our teeth should already be beautiful... support better breathing and optimal wellness.", "The one frontal shot in the video, saved for the close. Background falls to black, warm light from one side, gentle drift.", "\"foundation\" in bold. 22 seconds, no cutaways.", "The tour earned this. Side light keeps the frontal shot from ever looking flat."], ["logo", 149.5, 153.1, "Logo card", "", "Aviara logo over sheer white curtains.", "The logo fades up, the music finishes the video.", "Ends on the brand, clean and quiet."]], "pdf": "How-To-Edit-06-dr-ahn-local-tour.pdf", "silent": false, "grade": {"title": "Three looks, one warm thread", "lead": "The grade changes with the room, but it is never cold.", "notes": ["The black and white cutaway at 0:59 is the one exception: black and white means \"the old way\"."], "looks": [{"name": "Golden raw space", "where": "Shots 3 to 5, 11, 13", "tips": ["Warmest look. Push white balance toward amber.", "Keep the construction honest.", "Creamy highlights, never clipped."], "img": "s13", "sw": ["#463120", "#704F31", "#856843", "#9A7E54", "#C4AA89"], "bright": 0.43, "warm": 0.23, "sat": 0.47}, {"name": "High-key cream", "where": "Shots 14, 17 and every render", "tips": ["Bright and soft, low contrast.", "Pull saturation down. Skin and walls go cream.", "Whites must read warm."], "img": "s14", "sw": ["#796659", "#A79483", "#C1B3A8", "#DECBC0", "#F2E5E0"], "bright": 0.69, "warm": 0.11, "sat": 0.16}, {"name": "Low-key amber", "where": "Shots 18, 22 to 30", "tips": ["Let the shadows go almost black.", "One motivated side light, protect skin.", "About a quarter of the brightness of the cream look."], "img": "s30", "sw": ["#070605", "#1D160F", "#4A3623", "#6D503E", "#A8897B"], "bright": 0.25, "warm": 0.12, "sat": 0.38}]}, "music": {"title": "Voice first, music as a bed", "lead": "The track is there for mood. Her voice carries the video.", "notes": ["The music only comes up where she is not talking: the opening drones and the logo card.", "Pick something soft and warm, no lyrics, that will not compete with a two and a half minute voice track."], "kpis": [["92 BPM", "estimated tempo of the mix"], ["10/30", "cuts land within 2 frames of a beat (about 26% would by chance)"]]}, "sound": {"title": "Voice first", "lead": "", "notes": ["The music bed sits about 11 dB under her voice (measured: about -31 dB on the logo card with no voice vs about -20 dB under her voice).", "Loudness and peaks are right on target for social."], "kpis": [["-16.1 LUFS", "integrated loudness (social platforms play back around -14)", false], ["-4.3 dBTP", "true peak (safe, under -1)", false], ["3.1 LU", "loudness range (low means tightly compressed)"]], "rms": [-49.1, -33.1, -29.1, -34.4, -33.8, -26.4, -17.7, -18.0, -20.3, -21.2, -20.3, -22.3, -21.7, -28.8, -21.4, -20.9, -28.3, -18.4, -18.4, -19.7, -28.0, -20.6, -16.6, -18.2, -19.5, -21.7, -17.6, -19.6, -19.2, -18.9, -24.1, -31.3, -20.9, -18.2, -16.9, -18.0, -17.9, -16.8, -22.5, -22.6, -17.6, -17.3, -17.8, -20.2, -19.0, -20.7, -23.5, -20.9, -17.6, -19.0, -20.2, -20.4
