<meta property="og:description" content="Every post, every week: the reel, the caption and the thinking behind it.">

<meta property="og:image:height" content="630">

<style>
/* PuroFlow brand: Rich Black, Charcoal, Steel, Off White, Deep Blue as the only accent. Orbitron display, Montserrat body.
   Mock post covers inside the phones use Adit's own brand (white, navy, blue, orange, Ubuntu). */
:root{
  --black:#0A0A0A; --charcoal:#1A1A1A; --steel:#555555; --white:#F5F5F5; --blue:#1E3A5F;
  --blue-lit:#6E98CC; --muted:#A7ABB2; --faint:#80858E; --line:rgba(245,245,245,.10);
  --ok:#5FBF8A; --warn:#E3A44B;
  --a-navy:#092A3D; --a-blue:#25A8E0; --a-orange:#F28820;
  --display:"Orbitron","Eurostile","Arial Black",sans-serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --adit:"Ubuntu","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--black);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.logo-svg{width:100%;height:auto;display:block}
button{font:inherit;color:inherit}

/* ---------- shared pieces ---------- */
.label{display:flex;align-items:center;gap:.9em;font-family:var(--display);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--blue-lit)}
.label::before{content:"";width:1.9em;height:2px;background:var(--blue-lit);flex:none}
.flowline{font-family:var(--display);font-weight:600;color:var(--white)}
.flowline em{font-style:normal;color:var(--blue-lit)}
.chip{display:inline-flex;align-items:center;border-radius:999px;background:var(--blue);color:var(--white);font-family:var(--body);font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;border-radius:999px;border:1px solid rgba(245,245,245,.4);font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:.6em;border-radius:999px;border:1px solid rgba(245,245,245,.18);font-family:var(--body);font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--white)}
.status i{width:.62em;height:.62em;border-radius:50%;background:var(--faint);flex:none}
.status[data-s="Posted"] i{background:var(--ok)}
.status[data-s="Ready"] i{background:var(--blue-lit)}
.status[data-s="Needs Adit approval"] i{background:var(--warn)}
.phone{position:relative;aspect-ratio:9/16;border-radius:12% / 6.75%;padding:2.6%;background:linear-gradient(160deg,#2a2a2a,#0f0f0f 40%,#1c1c1c);box-shadow:0 0 0 1px rgba(245,245,245,.16) inset,0 30px 70px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:100%;border-radius:10% / 5.6%;overflow:hidden;background:#000;container-type:inline-size}
.screen video,.screen img{width:100%;height:100%;object-fit:cover;display:block}
.car{position:absolute;inset:0;background:#000}
.car .sl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;height:auto;opacity:0;transition:opacity .6s;display:block}
.car .sl.on{opacity:1}
.sdots{position:absolute;left:0;right:0;bottom:4.5%;display:flex;justify-content:center;gap:6px;z-index:3}
.sdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s}
.sdots i.on{background:#fff}
.screen>img.cov{object-fit:cover}
.island{position:absolute;top:3.2%;left:50%;transform:translateX(-50%);width:30%;height:3.4%;border-radius:20px;background:#000;z-index:3}
.snd{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.6em;border-radius:999px;border:1px solid rgba(245,245,245,.3);font-family:var(--body);font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.snd:hover{background:rgba(245,245,245,.08)}
.snd:focus-visible,.btn:focus-visible,.wtab:focus-visible,.nav:focus-visible,.card:focus-visible{outline:2px solid var(--blue-lit);outline-offset:3px}
.snd svg{width:1.2em;height:1.2em}
.snd[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.track{flex:1;height:3px;border-radius:2px;background:rgba(245,245,245,.15);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--blue-lit)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.8em;border-radius:999px;font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:transform .2s,background .2s}
.btn svg{width:1.05em;height:1.05em}
.btn.solid{background:var(--white);color:var(--black)}
.btn.ghost{border:1px solid rgba(245,245,245,.35);color:var(--white)}
.btn:hover{transform:translateY(-2px)}
.lightbar{position:relative;height:2px;background:linear-gradient(90deg,transparent,rgba(110,152,204,.35) 20%,rgba(245,245,245,.55) 50%,rgba(110,152,204,.35) 80%,transparent);overflow:hidden}
.lightbar::after{content:"";position:absolute;top:-3px;bottom:-3px;width:22%;left:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff 50%,transparent);filter:blur(2px)}
.on .lightbar::after,.feed .lightbar::after{animation:sweep 6.5s cubic-bezier(.6,0,.2,1) .35s infinite}
@keyframes sweep{0%{transform:translateX(-100%)}40%,100%{transform:translateX(454.5%)}}
.results{display:flex;gap:2.2em}
.results div{display:flex;flex-direction:column;gap:.35em}
.results b{font-family:var(--display);font-weight:800;color:var(--white);font-variant-numeric:tabular-nums}
.results span{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.notebox{border:1px solid rgba(245,245,245,.14);border-left:3px solid var(--warn);border-radius:10px;background:rgba(245,245,245,.03)}
.notebox p{margin:0;color:#D9DBDF}
.notebox p + p{margin-top:.5em}
.notebox b{color:var(--white)}

/* ---------- Adit-brand mock covers (scale with the phone via cqw) ---------- */
.mock{position:absolute;inset:0;font-family:var(--adit);display:flex;flex-direction:column;padding:16cqw 7cqw 8cqw}
.mock.light{background:#fff;color:var(--a-navy)}
.mock.dark{background:radial-gradient(120% 70% at 50% 0%,#14455f,var(--a-navy) 60%);color:#fff}
.mock .wm{font-weight:700;font-size:8cqw;letter-spacing:-.02em;line-height:1}
.mock .wm .wa{color:var(--a-orange)}.mock .wm .wb{color:var(--a-blue)}
.mock .tag{margin-top:4cqw;align-self:flex-start;background:var(--a-blue);color:#fff;font-weight:700;font-size:3.6cqw;letter-spacing:.06em;text-transform:uppercase;padding:1.6cqw 3.2cqw;border-radius:99px}
.mock .h{margin-top:5cqw;font-weight:700;font-size:13cqw;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
.mock .h em{font-style:normal;color:var(--a-orange)}
.mock .sub{margin-top:3cqw;font-weight:500;font-size:4.6cqw;opacity:.85}
.mock .rows{margin-top:6cqw;display:flex;flex-direction:column;gap:2.4cqw}
.mock .row{display:grid;grid-template-columns:7cqw 1fr auto;align-items:center;gap:2.4cqw;font-size:4.2cqw;font-weight:500}
.mock .row .r{width:7cqw;height:7cqw;border-radius:50%;display:grid;place-items:center;background:#EAF6FC;color:var(--a-navy);font-weight:700;font-size:3.6cqw}
.mock .row:nth-child(1) .r{background:var(--a-orange);color:#fff}
.mock .row .bar{grid-column:2/4;height:1.4cqw;border-radius:2cqw;background:#EEF2F5;overflow:hidden;margin-top:-1cqw}
.mock .row .bar i{display:block;height:100%;background:var(--a-blue)}
.mock .row .p{font-weight:700;color:var(--a-blue)}
.mock .cta{margin-top:auto;align-self:center;background:var(--a-blue);color:#fff;font-weight:700;font-size:4.6cqw;padding:3cqw 6cqw;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.mock.dark .cta{background:var(--a-orange)}
.mock .clock{margin-top:6cqw;display:flex;gap:2cqw}
.mock .clock div{flex:1;background:rgba(255,255,255,.1);border-radius:3cqw;padding:3cqw 0;text-align:center}
.mock .clock b{display:block;font-size:10cqw;font-weight:700;line-height:1}
.mock .clock span{display:block;margin-top:1cqw;font-size:3cqw;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.mock .podium{margin-top:6cqw;display:flex;flex-direction:column;gap:2cqw;font-size:4.4cqw;font-weight:500}
.mock .podium div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:2cqw}
.mock .podium b{color:var(--a-orange)}
.mock .stats{margin-top:6cqw;display:flex;flex-direction:column;gap:4cqw}
.mock .stats div{display:flex;flex-direction:column}
.mock .stats b{font-size:17cqw;font-weight:700;line-height:.9;color:var(--a-blue)}
.mock .stats div:nth-child(2) b{color:var(--a-orange)}
.mock .stats span{font-size:4.6cqw;font-weight:500;margin-top:1cqw}
.mock .slides{position:absolute;left:0;right:0;bottom:3.5cqw;display:flex;justify-content:center;gap:1.6cqw}
.mock .slides i{width:1.8cqw;height:1.8cqw;border-radius:50%;background:#C9D3DA}
.mock .slides i{transition:background .4s}
.mock.dark .slides i{background:rgba(255,255,255,.3)}
.mock .slides i.on{background:var(--a-blue)}
.mock.dark .slides i.on{background:#fff}
.mock .prod{position:absolute;top:9cqw;right:5cqw;font-size:3cqw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1.4cqw 2.6cqw;border-radius:99px;background:rgba(9,42,61,.08);color:var(--a-navy)}
.mock.dark .prod{background:rgba(255,255,255,.14);color:#fff}

/* ================= DESKTOP DECK ================= */
.deck{position:fixed;inset:0;background:var(--black);overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--black)}
.grid::before{content:"";position:absolute;left:-96px;top:-96px;right:0;bottom:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:96px 96px;animation:gdrift 36s linear infinite}
@keyframes gdrift{to{transform:translate(96px,96px)}}
.grid{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.35;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000 20%,transparent 75%)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s linear .5s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.slide.before{transform:translateX(-40px)}
.top{position:absolute;left:140px;right:140px;top:44px;height:64px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.top .mark{width:200px;transition:opacity .3s}
.deck.hide-mark .top .mark{opacity:0}
.wtabs{display:flex;gap:10px;margin-left:auto}
.wtab{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:11px 16px;border-radius:14px;border:1px solid rgba(245,245,245,.14);background:rgba(10,10,10,.6);transition:border-color .2s,background .2s}
.wtab:hover{border-color:rgba(245,245,245,.4)}
.wtab b{font:700 15px/1 var(--display);letter-spacing:.2em;text-transform:uppercase}
.wtab span{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.wtab[aria-selected="true"]{background:var(--blue);border-color:var(--blue)}
.wtab[aria-selected="true"] span{color:#C9D6E6}
.bottom{position:absolute;left:140px;right:140px;bottom:40px;display:flex;align-items:center;gap:26px;z-index:6}
.bars{display:flex;gap:8px;flex:1}
.bars button{all:unset;cursor:pointer;flex:1;height:22px;display:flex;align-items:center}
.bars button i{display:block;width:100%;height:3px;background:rgba(245,245,245,.14);border-radius:2px;transition:background .3s}
.bars button.done i{background:rgba(245,245,245,.45)}
.bars button.cur i{background:var(--blue-lit)}
.count{font:600 16px/1 var(--display);letter-spacing:.18em;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.nav{all:unset;cursor:pointer;width:54px;height:54px;border-radius:50%;border:1px solid rgba(245,245,245,.22);display:grid;place-items:center}
.nav:hover{background:rgba(245,245,245,.08)}
.nav svg{width:22px;height:22px}
.fs{all:unset;cursor:pointer;font:600 13px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--faint);padding:10px 0}
.fs:hover{color:var(--white)}

.socials{display:flex;gap:10px;align-items:center}.socials a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);transition:color .2s,border-color .2s,background .2s}.socials a:hover,.socials a:focus-visible{color:#fff;border-color:var(--blue-lit);background:rgba(30,58,95,.45)}.socials svg{width:18px;height:18px}
.cover .foot .socials{margin-left:24px}.cover .foot .who{margin-left:auto}
.fhead .frow{display:flex;align-items:center;justify-content:space-between;gap:10px}.socials.fm{margin-top:22px;flex-wrap:wrap}.socials.sm{gap:6px}.socials.sm a{width:30px;height:30px}.socials.sm svg{width:14px;height:14px}
/* cover */
.cover .glow{position:absolute;inset:0;background:radial-gradient(ellipse 45% 60% at 74% 55%,rgba(30,58,95,.75),transparent 70%),radial-gradient(ellipse 30% 30% at 12% 90%,rgba(30,58,95,.35),transparent 70%)}
.cover .left{position:absolute;left:140px;top:170px;width:800px;display:flex;flex-direction:column}
.cover .logo{width:340px}
.cover .eyebrow{margin-top:78px;font:600 16px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.cover .weekof{margin-top:30px;font:600 38px/1 var(--display);letter-spacing:.24em}
.cover .big{margin-top:14px;font:900 156px/.9 var(--display);white-space:nowrap}
.cover .to{margin-top:20px;font:600 54px/1 var(--display);letter-spacing:.08em}
.cover .to span{color:var(--blue-lit)}
.cover .sub{margin-top:36px;font:500 23px/1.5 var(--body);color:var(--muted);max-width:660px}
.cover .lightbar{position:absolute;left:0;right:0;bottom:168px}
.cover .foot{position:absolute;left:140px;right:140px;bottom:112px;display:flex;justify-content:space-between;align-items:center}
.cover .foot .flowline{font-size:18px;letter-spacing:.5em}
.cover .who{font:600 14px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.fan{position:absolute;right:70px;top:170px;width:900px;height:700px;perspective:2200px}
.fan .phone{position:absolute;bottom:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s}
.fan{cursor:grab;touch-action:pan-y;user-select:none}.fan.dragging{cursor:grabbing}.fan .phone.fp{transition:left .6s cubic-bezier(.2,.7,.2,1),height .6s cubic-bezier(.2,.7,.2,1),bottom .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1),opacity .6s}.fan.dragging .phone.fp{transition:none}.fan .phone.fp video,.fan .phone.fp img{pointer-events:none;-webkit-user-drag:none}
.slide:not(.on) .fan .phone{transform:translateY(60px) scale(.96)!important}

/* glance */
.glance .head{position:absolute;left:140px;right:140px;top:150px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.h2{margin:0;font:800 54px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.glance .head p{max-width:1080px;margin:16px 0 0;font:500 21px/1.5 var(--body);color:var(--muted)}
.cards{position:absolute;left:140px;right:140px;top:330px;display:grid;gap:26px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .thumb{position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:var(--charcoal);box-shadow:0 0 0 1px rgba(245,245,245,.12) inset;container-type:inline-size}
.card .thumb>img,.card .thumb>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .thumb>.fit{object-fit:contain}
.card .thumb::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 2px var(--blue-lit) inset;opacity:0;transition:opacity .25s;z-index:4}
.card:hover .thumb::after,.card:focus-visible .thumb::after{opacity:1}
.card .mock{padding:14cqw 7cqw 9cqw}
.card .d{font:700 15px/1 var(--display);letter-spacing:.2em;color:var(--blue-lit);text-transform:uppercase;margin-top:4px}
.card .t{font:700 20px/1.28 var(--body);text-wrap:balance}
.card .b{font:600 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .status{font-size:11px;padding:6px 10px;align-self:flex-start}
.cards.n7 .t{font-size:18px}

/* day */
.day .ph{position:absolute;left:170px;top:120px;height:770px}
.day .ph .phone{height:100%}
.day .ctrl{position:absolute;left:170px;top:912px;width:433px;display:flex;align-items:center;gap:18px}
.day .ctrl .snd{height:46px;padding:0 20px;font-size:14px}
.day .col{position:absolute;left:740px;right:140px;top:140px;bottom:118px;display:flex;flex-direction:column}
.day .tags{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.day .tags .pill{height:42px;padding:0 24px;font-size:16px}
.day .tags .chip{height:42px;padding:0 20px;font-size:14px}
.day .tags .status{height:42px;padding:0 18px;font-size:13px}
.day .tags .fmt{font:600 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-left:6px}
.day h2{margin:26px 0 0;font:800 54px/1.08 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;max-width:1040px}
.day .hook{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.day .label{font-size:14px}
.day .hook p{margin:0;font:600 28px/1.35 var(--body);text-wrap:balance}
.day .two{margin-top:32px;display:grid;grid-template-columns:1.1fr 1fr;gap:60px;min-height:0}
.day .blk{display:flex;flex-direction:column;gap:12px;min-width:0}
.day .blk + .blk{margin-top:28px}
.day .txt p{margin:0 0 10px;font:400 18.5px/1.58 var(--body);color:#D9DBDF}
.day .txt p:last-child{margin-bottom:0}
.day .hash{font:500 16px/1.55 var(--body);color:var(--faint);margin:0}
.day .notebox{padding:14px 18px;font:500 16px/1.5 var(--body)}
.day .foot{margin-top:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.day .foot .btn{height:60px;padding:0 30px;font-size:16px}
.day .foot .notebox{flex:1 1 380px}
.day .results{margin-left:auto;font-size:13px}
.day .results b{font-size:32px}

/* learnings + asks */
.learn .wrapc,.asks .wrapc{position:absolute;left:140px;right:140px;top:170px}
.learn .tiles{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.learn .tile{border:1px solid rgba(245,245,245,.12);border-radius:22px;padding:34px 30px;background:linear-gradient(180deg,rgba(30,58,95,.28),rgba(26,26,26,.4));display:flex;flex-direction:column;gap:18px;min-height:320px}
.learn .tile b{font:900 72px/1 var(--display);color:var(--white)}
.learn .tile p{margin:0;font:500 20px/1.5 var(--body);color:#D9DBDF}
.learn .lead{margin:18px 0 0;font:500 22px/1.5 var(--body);color:var(--muted);max-width:1200px}
.asks .list{margin-top:50px;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}

/* ================= BREATHING: everything moves, nothing plays offscreen ================= */
/* card media: the poster sits underneath and the preview loop fades in once it is really playing */
.pv{opacity:0;transition:opacity .5s ease}
.pv.live{opacity:1}
.card .thumb>.bk,.mcard .mm>.bk,.tcar .bk{position:absolute;left:-12%;top:-12%;right:auto;bottom:auto;width:124%;height:124%;object-fit:cover;filter:blur(14px) brightness(.5) saturate(1.2)}
.tcar{position:absolute;inset:0;overflow:hidden}
.tcar .tsl{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.tcar .tsl.on{opacity:1}
.tcar .tsl>.fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:kb 8s ease-in-out infinite alternate}
.tcar .tsl:nth-child(even)>.fg{animation-direction:alternate-reverse}
.kb{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{from{scale:1}to{scale:1.08}}
.card .thumb,.mcard .mm{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb,.card:focus-visible .thumb,.mcard:hover .mm,.mcard:focus-visible .mm{transform:translateY(-5px)}
/* today */
.now{position:absolute;left:9px;top:9px;z-index:5;display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(10,10,10,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(245,245,245,.24);font:700 10px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:#fff}
.now i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--blue-lit)}
.now i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.card.today .thumb::after{opacity:1;animation:halo 2.8s ease-in-out infinite}
@keyframes halo{50%{opacity:.35}}
.strip .now{left:6px;top:6px;padding:4px 7px 4px 6px;gap:5px;font-size:8px}
.strip .now i{width:6px;height:6px}
/* live dots: anything still in motion pulses */
.status i{position:relative}
.status:not([data-s="Posted"]) i::after,.rt i::after,.ghero h1 i::after,.vbtn[aria-pressed="true"] i::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
.rt i,.ghero h1 i,.vbtn i{position:relative}
@keyframes ping{0%{transform:scale(1);opacity:.7}75%,100%{transform:scale(2.7);opacity:0}}
/* ambient light */
.cover .glow,.close .glow,.fhero::before,.fclose::before{animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.7;transform:scale(1)}to{opacity:1;transform:scale(1.07)}}
.slide.on .fan .phone{animation:bob 6.5s ease-in-out infinite alternate;animation-delay:calc(var(--k,0) * -1.3s)}
@keyframes bob{from{translate:0 6px}to{translate:0 -9px}}
/* slides breathe in: content rises in order every time a slide comes up */
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes phin{from{opacity:0;transform:translateY(26px) scale(.97)}}
.slide.on .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k,0) * 70ms + 140ms)}
.slide.on.glance .head,.slide.on .wrapc>.h2,.slide.on .wrapc>.lead,.slide.on .wrapc>.upd,.slide.on .wrapc>.next{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.slide.on .wrapc>.lead{animation-delay:.08s}
.slide.on.cover .left>*,.slide.on.day .col>*,.slide.on .tiles>.tile,.slide.on .list>.item,.slide.on .sb tbody tr,.slide.on .sb tfoot tr,.slide.on.close .inner>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(1){animation-delay:.1s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(2){animation-delay:.17s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(3){animation-delay:.24s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(4){animation-delay:.31s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(5){animation-delay:.38s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(6){animation-delay:.45s}
.slide.on :is(.left,.col,.tiles,.list,tbody,.inner)>:nth-child(n+7){animation-delay:.52s}
.slide.on .sb tfoot tr{animation-delay:.6s}
.slide.on.day .ph{animation:phin .85s cubic-bezier(.2,.7,.2,1) both}
.on .share,.feed .share.in{animation:fill 1.4s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes fill{from{clip-path:inset(0 100% 0 0)}}
/* the feed and the groups page rise in as you scroll */
.rvon .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .75s cubic-bezier(.2,.7,.2,1)}
.rvon .rv.in{opacity:1;transform:none}
/* Adit mocks come alive: CTA breathes, bars refill, a light sheen passes, the clock ticks (script) */
.mock .cta{animation:cta 2.8s ease-in-out infinite}
@keyframes cta{0%,100%{scale:1}50%{scale:1.05}}
.mock .row .bar i{transform-origin:left center;animation:bar 7s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes bar{0%{transform:scaleX(0)}24%,86%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.mock::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.13) 50%,transparent 60%);transform:translateX(-110%);animation:sheen 7s ease-in-out 1.5s infinite}
.mock.light::after{background:linear-gradient(105deg,transparent 40%,rgba(37,168,224,.13) 50%,transparent 60%)}
@keyframes sheen{0%{transform:translateX(-110%)}32%,100%{transform:translateX(110%)}}
.mock .prod::before{content:"";display:inline-block;width:1.3cqw;height:1.3cqw;margin-right:1.3cqw;border-radius:50%;background:var(--a-orange);vertical-align:.12em;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.mock .clock b,.mock .stats b,.gtile b,.tile b,.sharekey b,.vw b{font-variant-numeric:tabular-nums}
/* groups: testimonial thumbs drift, play rings ripple, stars twinkle, coming-soon stripes run */
.ytm .fg{animation:kb 10s ease-in-out infinite alternate}
.ytm .bg{animation:kb 13s ease-in-out infinite alternate-reverse}
.playg::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);animation:ring 2.6s cubic-bezier(0,0,.2,1) infinite}

function countUp(el, again){

  const raw = el.dataset.raw || tn.nodeValue, m = raw.trim().match(NUMRX); if (!m) return;

  const pre = raw.match(/^\s*/)[0], post = raw.match(/\s*$/)[0], comma = m[2].includes(",");
  const fmt = x => pre + m[1] + (comma ? Math.round(x).toLocaleString("en-US") : x.toFixed(dec)) + m[4] + post;

  root.querySelectorAll(COUNT).forEach(el => cio.observe(el));
  cleanup.push(() => { lio.disconnect(); cio.disconnect(); });

  const els = [...root.querySelectorAll(revealSel)]; if (!els.length) return;

    <div class="list">${w.close.items.map(it=>`<div class="item"><b>${esc(it.k)}</b><p>${esc(it.v)}</p></div>`).join("")}</div><div class="next">${esc(w.close.next)}</div></div><div class="flowline">CREATE IN <em>FLOW</em> STATE.</div></section>`});

  app.innerHTML = `<div class="deck" id="deck"><div class="stage" id="stage"><div class="grid"></div>

    <div id="slides">${S.map(s=>s.h).join("")}</div>
    <div class="bottom"><div class="bars" id="bars">${S.map((s,i)=>`<button type="button" aria-label="Go to slide ${i+1}"><i></i></button>`).join("")}</div>
      <button class="fs" id="fs" type="button">Full screen</button><span class="count" id="count"></span>
      <button class="nav" id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="nav" id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button></div>
  </div></div>`;
  const deck = document.getElementById("deck"), stage = document.getElementById("stage");
  const slides = [...deck.querySelectorAll(".slide")], bars = [...deck.querySelectorAll("#bars button")];
  const wt = deck.querySelector(".wtabs"), wsel = wt && wt.querySelector('[aria-selected="true"]');
  if (wt && wsel) wt.scrollLeft = Math.max(0, (wsel.offsetLeft - wt.offsetLeft) - wt.clientWidth + wsel.offsetWidth + 6);
  if (wt && wt.scrollWidth > wt.clientWidth + 2) wt.classList.add("scrolly");
  let cur = -1;
  const fit = ()=>{ const k = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${k})`; };

  function go(i){
    i = Math.max(0, Math.min(slides.length-1, i)); if (i === cur) return;
    const prev = cur; cur = i;
    slides.forEach((s,k)=>{ s.classList.toggle("on",k===i); s.classList.toggle("before",k<i); });

    setHash(i === 0 ? w.id : `${w.id}-${S[i].t}`);
  }
  bars.forEach((b,k)=>b.addEventListener("click",()=>go(k)));
  document.getElementById("next").onclick = ()=>go(cur+1);
  document.getElementById("prev").onclick = ()=>go(cur-1);
  deck.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
  /* cards play on their own while the glance slide is up; with reduced motion they wait for a hover */
  deck.querySelectorAll(".card").forEach(c=>{
    const v = c.querySelector("video.pv"); if (!v) return;
    const on = ()=>{ if (still()) spin(v, true); }, off = ()=>{ if (still()) rest(v); };
    c.addEventListener("mouseenter",on); c.addEventListener("mouseleave",off); c.addEventListener("focus",on); c.addEventListener("blur",off);
  });
  slides.forEach(s=>{ if (s.classList.contains("day")) wireVideo(s, s.querySelector(".track i")); });
  deck.querySelectorAll(".wtab").forEach(t=>t.addEventListener("click",()=>switchWeek(t.dataset.week)));
  /* ---- cover fan: drag or click to roll through every post ---- */
  const fanEl = deck.querySelector(".cover .fan");
  if (fanEl){
    const fps = [...fanEl.querySelectorAll(".phone.fp")], N = fps.length;
    /* lazy susan: phones sit on a turning circle; dragging spins it, release snaps to the nearest phone */
    const R = 360, CX = 298 + 700*9/16/2, STEP = 150, ARC = 34;
    let center = Math.min(Math.floor(N/2), N-1);
    const wrapOff = o => { while (o > N/2) o -= N; while (o < -N/2) o += N; return o; };
    const layout = (spin)=>{
      spin = spin || 0;
      fps.forEach((p,i)=>{
        const f = wrapOff(i - center) + spin, a = Math.abs(f), th = f * ARC * Math.PI/180;
        const vis = a < 2.6, depth = Math.cos(Math.min(Math.abs(th), Math.PI/2));
        const h = 470 + 230 * depth, wpx = h * 9/16;
        p.style.left = (CX + R*Math.sin(th) - wpx/2) + "px"; p.style.height = h + "px";
        p.style.bottom = (a * 24) + "px";
        p.style.zIndex = Math.round(100 - a*10);
        p.style.opacity = vis ? Math.max(0, Math.min(1, a < 1 ? 1 : 1 - (a-1)*.18 - Math.max(0, a-2)*1.2)) : 0;
        p.style.transform = `rotateY(${-f*ARC*.55}deg)`; p.style.pointerEvents = vis ? "" : "none";
        p.classList.toggle("front", Math.round(f) === 0 && a < .5);
      });
    };
    const playFront = ()=>{ fps.forEach((p,i)=>{ const v = p.querySelector("video"); if (!v) return; if (i === center && slides[cur] && slides[cur].classList.contains("cover")){ const pp = v.play(); if (pp) pp.catch(()=>{}); } }); };
    const roll = d => { center = ((center + d) % N + N) % N; layout(); playFront(); };
    layout();
    let fx = null, fy = null, moved = 0, tgt = null;
    const k = ()=> Math.min(innerWidth/1920, innerHeight/1080) || 1;
    fanEl.addEventListener("pointerdown", e=>{ e.stopPropagation(); fx = e.clientX; fy = e.clientY; moved = 0; tgt = e.target.closest(".phone.fp"); fanEl.classList.add("dragging"); try{ fanEl.setPointerCapture(e.pointerId); }catch(_){} });
    fanEl.addEventListener("pointermove", e=>{ if (fx === null) return; moved = (e.clientX - fx)/k(); layout(moved/STEP); });
    const end = e=>{
      if (fx === null) return; e.stopPropagation(); fanEl.classList.remove("dragging");
      const dist = Math.hypot(e.clientX - fx, e.clientY - fy); fx = null;
      const steps = Math.round(moved/STEP);
      if (Math.abs(moved) > 40) { layout(moved/STEP); requestAnimationFrame(()=>roll(steps ? -steps : (moved < 0 ? 1 : -1))); }
      else if (dist < 8 && tgt){ const off = wrapOff(+tgt.dataset.fi - center); if (off) roll(off); else layout(); }
      else layout();
    };
    fanEl.addEventListener("pointerup", end); fanEl.addEventListener("pointercancel", end);
    fanEl.addEventListener("wheel", e=>{ if (Math.abs(e.deltaX) > 30){ e.preventDefault(); roll(e.deltaX > 0 ? 1 : -1); } }, {passive:false});
  }
  const key = e=>{
    if (e.target.closest && e.target.closest("button,a") && (e.key===" "||e.key==="Enter")) return;
    if (["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)) { e.preventDefault(); go(cur+1); }
    else if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)) { e.preventDefault(); go(cur-1); }

  };
  addEventListener("keydown", key); cleanup.push(()=>removeEventListener("keydown", key));
  let sx=null, sy=null;
  deck.addEventListener("pointerdown", e=>{ sx=e.clientX; sy=e.clientY; });
  deck.addEventListener("pointerup", e=>{ if (sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4) go(cur+(dx<0?1:-1)); });
  const fsBtn = document.getElementById("fs");
  function toggleFs(){ try { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else document.documentElement.requestFullscreen().catch(()=>{ fsBtn.hidden = true; }); } catch(e){ fsBtn.hidden = true; } }
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.onclick = toggleFs;
  const fsc = ()=>{ fsBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; };
  document.addEventListener("fullscreenchange", fsc); cleanup.push(()=>document.removeEventListener("fullscreenchange", fsc));
  const want = dayFromHash(); const start = want ? S.findIndex(s=>s.t===want) : 0;
  go(start > 0 ? start : 0);
}

/* carousels: auto-advance, tap to advance */
function stepCar(car, auto){ const im=[...car.querySelectorAll(".sl")]; if (im.length<2) return; const i=im.findIndex(x=>x.classList.contains("on")); const cur=im[i];
  if (auto && cur.tagName==="VIDEO" && !cur.ended && !cur.paused) return;
  const j=(i+1)%im.length, nx=im[j]; if (cur.tagName==="VIDEO") cur.pause();
  cur.classList.remove("on"); nx.classList.add("on");
  if (nx.tagName==="VIDEO"){ if (!nx.getAttribute("src")) nx.src = nx.dataset.src; nx.muted = true; try{ nx.currentTime = 0; }catch(e){} nx.play().catch(()=>{}); }
  const dots=car.parentElement.querySelectorAll(".sdots i"); dots.forEach((dd,k)=>dd.classList.toggle("on",k===j)); }
setInterval(()=>{ if (document.hidden || still()) return; document.querySelectorAll(".slide.on .car, .feed .car").forEach(c=>stepCar(c,true)); }, 3200);
/* the heartbeat: mock clocks tick down, mock carousel dots step, thumbnail carousels turn (only where you can see them) */
const CLK0 = 11*3600 + 59*60 + 59; let clk = CLK0, beat = 0;
setInterval(()=>{
  if (document.hidden || still()) return;
  beat++; clk = clk > 0 ? clk - 1 : CLK0;
  const hh = String(Math.floor(clk / 3600)), mm = String(Math.floor(clk / 60) % 60).padStart(2, "0"), ss = String(clk % 60).padStart(2, "0");
  document.querySelectorAll(".mock .clock").forEach(c => { const b = c.querySelectorAll("b"); if (b.length === 3){ b[0].textContent = hh; b[1].textContent = mm; b[2].textContent = ss; } });
  if (beat % 2 === 0) document.querySelectorAll(".mock .slides").forEach(s => { const d = [...s.children], i = d.findIndex(x => x.classList.contains("on")); d.forEach((x, k) => x.classList.toggle("on", k === (i + 1) % d.length)); });
  if (beat % 3 === 0) document.querySelectorAll(".tcar").forEach(c => { if (!c.closest(".vis")) return; const s = [...c.children], i = s.findIndex(x => x.classList.contains("on")); s.forEach((x, k) => x.classList.toggle("on", k === (i + 1) % s.length)); });
}, 1000);

}
function slotRow(m, g, vid){

  return `<tr style="--vc:${vc}"><td data-l="Group">${gname(g)}<small>${can} · ${freq}</small></td><td data-l="Who posts">${g.posters.length ? esc(g.posters.join(", ")) : "To confirm"}</td>${slotCell(m, g, "w1")}${slotCell(m, g, "w3")}</tr>`;
}
function slotTable(m, vids){
  return `<table class="slt"><thead><tr><th>Sponsored group</th><th>Who posts</th><th>${m.weeks.w1.label} · ${m.weeks.w1.range}</th><th>${m.weeks.w3.label} · ${m.weeks.w3.range}</th></tr></thead>
    <tbody>${vids.flatMap(vid => vgroups(vid).sponsored.map(g => slotRow(m, g, vid))).join("")}</tbody></table>`;
}
const rgbOf = hex => { const h = String(hex || "").replace("#", ""); return /^[0-9a-f]{6}$/i.test(h) ? [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)).join(",") : "110,152,204"; };
/* every group in a vertical as a wall of name tags: sponsored filled, groups we're in outlined, no access dashed */
function roomsWall(vid, o = {}){
  const v = vinfo(vid), L = vgroups(vid).all; if (!L.length) return "";
  const CUT = 8, rank = g => (g.sponsored ? 2 : 0) + (g.access ? 1 : 0);
  const list = L.slice().sort((a, b) => rank(b) - rank(a));
  const n = { sp: L.filter(g => g.sponsored).length, in: L.filter(g => !g.sponsored && g.access).length, off: L.filter(g => !g.sponsored && !g.access).length };
  const icon = (svg, cls) => svg.replace("<svg", `<svg${cls ? ` class="${cls}"` : ""} aria-hidden="true"`);
  const pill = (g, i) => {
    const cls = `room${g.sponsored ? " sp" : ""}${g.access ? "" : " off"}${i >= CUT ? " x" : ""}`;
    const tip = [g.sponsored ? "Sponsored" : "", g.access ? "We're in" : "No access yet", g.devi === true ? "Devi in" : ""].filter(Boolean).join(" · ");
    const body = `${g.sponsored ? STAR : g.access ? CHECK : icon(LOCK)}<span>${esc(g.name)}</span>${g.sponsored && !g.access ? icon(LOCK, "lk") : ""}`;
    return g.url ? `<a class="${cls}" style="--i:${i}" href="${esc(g.url)}" target="_blank" rel="noopener" title="${esc(tip)} · open on Facebook">${body}${icon(ARROW, "ar")}</a>`
      : `<span class="${cls}" style="--i:${i}" title="${esc(tip)}">${body}</span>`;
  };
  const key = [["sp", STAR, "Sponsored", n.sp], ["in", CHECK, "We're in", n.in], ["off", icon(LOCK), "No access yet", n.off]]
    .filter(k => k[3]).map(k => `<span class="k ${k[0]}">${k[1]}${k[2]} <em>${k[3]}</em></span>`).join("");
  return `<div class="rooms" style="--vc:${v.color};--vr:${rgbOf(v.color)}">
    <div class="rooms-h"><div class="rt"><i></i><b>${L.length} ${esc(v.label.toLowerCase())} groups</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ""}</div><div class="rkey">${key}</div></div>
    <div class="rwall">${list.map(pill).join("")}</div>${list.length > CUT ? `<button class="rmore" type="button" aria-expanded="false" data-n="${list.length - CUT}">+${list.length - CUT} more</button>` : ""}</div>`;
}
function stamp(iso){ try { return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" }) + " PT"; } catch(e){ return ""; } }
function buildGroups(){

  let tiles;

    + tile(tot.slots, `Post slots in ${m.tab}`, tot.tbc ? `${tot.tbc} of them wait on a confirmed limit` : "Two per open sponsored group")
    + tile(tot.menu, "Posts on the menu", `${tot.ready} ready now · ${tot.posted} posted so far`);
  else { const locked = vgroups(vid).sponsored.filter(g => !g.access).map(g => g.name);
    tiles = tile(S1.all, "Groups on our list", S1.access ? `${S1.access} where someone on our side has access` : "No access in any of them yet", !S1.access)
    + tile(`${S1.open} of ${S1.sp}`, "Sponsored groups open", locked.length ? `Locked: ${locked.join(", ")}` : "Every one of them is open", S1.open < S1.sp)
    + tile(S1.slots, `Post slots in ${m.tab}`, S1.tbc ? `${S1.tbc} of them wait on a confirmed limit` : S1.slots ? "Two per open sponsored group" : "Nothing to post into yet", !S1.slots)
    + tile(S1.menu, "Posts on the menu", `${S1.ready} ready now · ${S1.posted} posted so far`); }
  const intro = !all && !S1.open ? `Every post below is ready. We just need a room to put them in: no one on our side can post in any of the ${S1.all} ${vi.label.toLowerCase()} groups yet.` : m.summary;
  const menuBlock = all
    ? VS.map(v => { const items = m.menu.filter(x => x.v === v.id); return items.length ? `<div class="vblock" style="--vc:${v.color}"><div class="vtitle"><i></i>${v.label}<span>${items.length} posts</span></div><div class="mgrid">${items.map(mcard).join("")}</div></div>` : ""; }).join("")
    : `<div class="mgrid">${m.menu.filter(x => x.v === vid).map(mcard).join("")}</div>`;
  const lists = all ? vids.map(v => roomsWall(v)).join("") : "";
  const asks = (m.asks || []).map(a => `<div class="item"><b>${esc(a.k)}</b><p>${esc(a.v)}${a.k === "Log every post" && H.postLog ? ` <a href="${H.postLog}" target="_blank" rel="noopener">Open the Group Post Log</a>` : ""}</p></div>`).join("");
  app.innerHTML = `<div class="gv">
  <header class="ghead"><div class="gwrap"><a class="gmark" href="#${WEEKS[WEEKS.length - 1].id}" aria-label="PuroFlow Media, back to the organic calendar">${LOGO}</a>${modesNav()}
    <div class="mtabs" role="tablist" aria-label="Months">${GM.map(x => `<a class="wtab" role="tab" href="#groups-${x.id}${all ? "" : "-" + vid}" aria-selected="${x === m}"><b>${x.tab}</b><span>${x.year} · ${x.state}</span></a>`).join("")}</div></div></header>
  <div class="gwrap gbody">
    <aside class="rail" aria-label="Verticals"><div class="rail-h">Verticals</div>${rail}
      <div class="rail-note"><b>How a month runs</b><p>Week 1: Post 1 goes into every sponsored group we can post in.</p><p>Week 3: whatever won week 1 reruns in the rooms that haven't seen it.</p><p>Every day: soldiers comment, answer questions and log what they see. They don't pitch.</p></div>
      ${H.postLog ? `<a class="btn ghost" href="${H.postLog}" target="_blank" rel="noopener">Group Post Log ${ARROW}</a>` : ""}${H.mastersheet ? `<a class="btn ghost" href="${H.mastersheet}" target="_blank" rel="noopener">Groups Mastersheet ${ARROW}</a>` : ""}</aside>
    <main class="gmain">
      <section class="ghero" style="${vi ? `--vc:${vi.color}` : ""}"><div class="eyebrow">Facebook Groups · ${m.tab} ${m.year} · ${m.state}</div><h1>${vi ? `<i></i>${esc(vi.label)}` : "All verticals"}</h1><p>${esc(intro)}</p><div class="gtiles">${tiles}</div>${all ? "" : roomsWall(vid, { sub: "on our list · open any of them on Facebook" })}<div class="ghow"><div><b>${m.weeks.w1.label} · ${m.weeks.w1.range}</b><p>Post 1 goes into every sponsored group we can post in.</p></div><div><b>${m.weeks.w3.label} · ${m.weeks.w3.range}</b><p>Whatever won week 1 reruns in the rooms that haven't seen it. Pick it by ${esc(m.decideBy)}.</p></div><div><b>Every day</b><p>Soldiers comment, answer questions and log each post in the Group Post Log. They don't pitch.</p></div></div></section>
      <section class="gsec menu"><h2 class="h2">The menu</h2><p class="lead">Posts we can put in front of ${all ? "each vertical" : esc(vi.label.toLowerCase()) + " rooms"} this month, built from what's already filmed. Tap any post for the group caption, why it fits the room and where it goes.</p>${menuBlock}</section>
      <section class="gsec pbreak"><h2 class="h2">Sponsored groups · ${m.tab}</h2><p class="lead">Two posts per group per month. Week 1 tests, week 3 reruns the winner in the rooms that haven't seen it. Tap a slot to open the post.</p>${slotTable(m, vids)}</section>
      ${lists ? `<section class="gsec pbreak glsec"><h2 class="h2">Every group on our list</h2><p class="lead">From the FB Groups Mastersheet. Sponsored groups get Adit's two official posts a month. Everywhere else, soldiers comment and ask questions.</p>${lists}</section>` : ""}
      ${asks ? `<section class="gsec"><h2 class="h2">What we need from the Adit team</h2><div class="gasks">${asks}</div></section>` : ""}
      <footer class="gfoot"><div>Groups synced from the FB Groups Mastersheet${GL && GL.updated ? ` on ${stamp(GL.updated)}` : ""}. Results come from the Group Post Log.</div><div class="flowline">CREATE IN <em>FLOW</em> STATE.</div></footer>
    </main>
  </div></div>`;
  const gv = app.querySelector(".gv"), hd = gv.querySelector(".ghead");
  const setH = () => gv.style.setProperty("--ghh", hd.offsetHeight + "px"); setH();
  addEventListener("resize", setH); cleanup.push(() => removeEventListener("resize", setH));
  gv.querySelectorAll(".vbtn").forEach(b => b.addEventListener("click", () => { const v = b.dataset.v; location.hash = `groups-${m.id}${v === "all" ? "" : "-" + v}`; }));

  /* menu cards play while they're on screen (hover to play when reduced motion is on) */
  gv.querySelectorAll(".mcard").forEach(c => { const v = c.querySelector("video.pv"); if (!v) return;
    c.addEventListener("mouseenter", () => { if (still()) spin(v, true); }); c.addEventListener("mouseleave", () => { if (still()) rest(v); }); });
  watchLive(gv, ".ghero>*,.gsec>.h2,.gsec>.lead,.mcard,.vtitle,.slt,.glsec .rooms,.gasks .item,.gfoot");
  const rl = gv.querySelector(".rail"), sel = rl && rl.querySelector('.vbtn[aria-pressed="true"]');
  if (sel && rl.scrollWidth > rl.clientWidth) rl.scrollLeft = Math.max(0, sel.offsetLeft - 18);
}
let drawerKey = null;
function closeDrawer(){
  const d = document.querySelector(".drawer");
  if (d){ d.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); }); d.remove(); }
  document.body.style.overflow = "";
  if (drawerKey){ removeEventListener("keydown", drawerKey); drawerKey = null; }
}
function openDrawer(id){
  const m = gmonth, x = m && m.menu.find(i => i.id === id); if (!x) return;
  closeDrawer();
  const vc = vinfo(x.v).color, md = x.media || {};
  const where = []; Object.entries(m.slots).forEach(([gk, s]) => ["w1", "w3"].forEach(wk => { if (s[wk] && s[wk].post === id) where.push({ gk, wk, day: s[wk].day }); }));
  const gByKey = k => { for (const v of VS){ const V = vgroups(v.id), g = V.sponsored.find(g => g.key === k) || V.all.find(g => g.key === k); if (g) return g; } return { name: k }; };
  const log = logFor(m).filter(e => e.post === id);
  let media;
  if (md.type === "video") media = `<div class="phone"><div class="screen"><span class="island"></span><video playsinline loop preload="metadata" poster="${md.poster}" src="${md.src}"></video></div></div><button class="snd" type="button" aria-pressed="false">${SPK_OFF}<span>Tap for sound</span></button>`;
  else if (md.type === "youtube") media = `<div class="ytbox"><iframe src="https://www.youtube-nocookie.com/embed/${md.id}?rel=0&modestbranding=1&playsinline=1" title="${esc(x.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="ytnote">From Adit's testimonial library on YouTube</div>`;
  else media = `<div class="phone"><div class="screen"><span class="island"></span>${md.type === "mock" ? mock(md.kind, false, { groups: true }) : `<div class="comingm">${CAM}<b>${esc(x.status)}</b><span>${esc(md.line || "")}</span></div>`}</div></div>`;
  const acts = [];
  if (x.drive) acts.push(`<a class="btn solid" href="${x.drive}" target="_blank" rel="noopener">Open video file ${ARROW}</a>`);
  if (x.yt) acts.push(`<a class="btn ${x.drive ? "ghost" : "solid"}" href="${x.yt}" target="_blank" rel="noopener">Watch on YouTube ${ARROW}</a>`);
  if (x.ig) acts.push(`<a class="btn ghost" href="${x.ig}" target="_blank" rel="noopener">See it on Instagram ${ARROW}</a>`);
  const whereHtml = where.length ? where.map(p => { const e = log.find(l => l.group === p.gk); return `<div>${esc(gByKey(p.gk).name)}<span>${esc(m.weeks[p.wk].label)} · ${esc(p.day)}${e ? ` · ${fmtN(e.views)} views, ${fmtN(e.comments)} comments` : ""}</span></div>`; }).join("")
    : `<div>${esc(x.room)}<span>${x.status === "No group access" ? "Waiting on group access" : "Placed on the weekly call"}</span></div>`;
  const el = document.createElement("div");
  el.className = "drawer"; el.style.setProperty("--vc", vc);
  el.innerHTML = `<div class="dscrim"></div><aside class="dpanel" role="dialog" aria-modal="true" aria-label="${esc(x.title)}"><button class="dclose" type="button" aria-label="Close">${XI}</button>
    <div class="dmedia">${media}</div>

      <div class="dtags"><span class="chip">${esc(vinfo(x.v).label)}</span><span class="pill">${esc(x.id)}</span>${status(x.status)}</div>
      <h2>${esc(x.title)}</h2>
      <p class="who">${esc(x.talent)} · ${esc(x.format)} · ${esc(x.kind)}</p>
      ${x.caption ? `<div class="dblk"><div class="lrow"><div class="label">Group caption</div><button class="copy" type="button">Copy caption</button></div><div class="capbox">${x.caption.map(p => `<p>${esc(p)}</p>`).join("")}</div></div>` : ""}

      ${x.firstComment ? `<div class="dblk"><div class="label">First comment from the poster</div><div class="txt"><p>${esc(x.firstComment)}</p></div></div>` : ""}
      <div class="dblk"><div class="label">Why it fits the room</div><div class="txt"><p>${esc(x.why)}</p></div></div>
      <div class="dblk"><div class="label">Where it goes</div><div class="dwhere">${whereHtml}</div></div>
      ${(x.notes || []).length ? `<div class="notebox">${x.notes.map(n => `<p><b>Note:</b> ${esc(n)}</p>`).join("")}</div>` : ""}

  document.body.appendChild(el); document.body.style.overflow = "hidden";

  });

    const b = el.querySelector(".snd");
    const tog = () => { v.muted = !v.muted; if (v.paused) v.play().catch(()=>{}); b.setAttribute("aria-pressed", String(!v.muted)); b.innerHTML = (!v.muted ? SPK_ON : SPK_OFF) + `<span>${!v.muted ? "Sound on" : "Tap for sound"}</span>`; };

  drawerKey = e => { if (e.key === "Escape") closeDrawer(); };

/* ================= router ================= */
function isDesk(){ return innerWidth >= 900 && innerWidth > innerHeight * 1.05; }
function parseHash(){
  const h = (location.hash || "").slice(1);
  if (GM && /^groups(-|$)/.test(h)){
    const p = h.split("-");
    return { view: "groups", m: GM.find(x => x.id === p[1]) || GM[GM.length - 1], v: VS.some(x => x.id === p[2]) ? p[2] : "all" };
  }
  return { view: "organic", w: weekFromHash() };
}
function render(){
  cleanup.forEach(f=>f()); cleanup = [];
  closeDrawer();
  app.querySelectorAll("video").forEach(v=>{ v.pause(); v.removeAttribute("src"); v.querySelectorAll("source").forEach(s=>s.removeAttribute("src")); v.load(); });
  if (view === "groups"){ mode = "groups"; document.title = `Adit Facebook Groups · ${gmonth.tab} | PuroFlow Media`; buildGroups(); return; }
  mode = isDesk() ? "desk" : "feed";
  document.title = `Adit Content Calendar · Week ${week.n} | PuroFlow Media`;
  if (mode === "desk") buildDeck(); else { buildFeed(); }
}
function route(){
  const r = parseHash();
  if (r.view === "groups"){
    const changed = view !== "groups" || gmonth !== r.m || gvert !== r.v;
    view = "groups"; gmonth = r.m; gvert = r.v;
    if (changed){ render(); scrollTo(0, 0); }
  } else {
    const was = view, changed = view !== "organic" || r.w !== week;
    view = "organic"; week = r.w;
    if (changed){ render(); if (was !== "organic") scrollTo(0, 0); }
  }
}
function switchWeek(id){
  const w = WEEKS.find(x=>x.id===id); if (!w || w===week) return;
  week = w; setHash(w.id); render(); if (mode==="feed") scrollTo(0,0);
}
(function init(){
  const r = parseHash(); view = r.view;
  if (r.view === "groups"){ gmonth = r.m; gvert = r.v; week = WEEKS[WEEKS.length - 1]; } else week = r.w;
  render();
})();
addEventListener("resize", ()=>{ if (view === "organic" && (isDesk()?"desk":"feed") !== mode) render(); });
addEventListener("hashchange", route);
if (RM.addEventListener) RM.addEventListener("change", ()=>render());
